[build]
  command = "npm ci && npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-optional"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/ffmpeg/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/ffmpeg/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*.js"
  [headers.values]
    Content-Type = "text/javascript"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/image/*.js"
  [headers.values]
    Content-Type = "text/javascript"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/text/*.js"
  [headers.values]
    Content-Type = "text/javascript"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/ml/*.js"
  [headers.values]
    Content-Type = "text/javascript"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/time/*.js"
  [headers.values]
    Content-Type = "text/javascript"
    Cache-Control = "public, max-age=86400"

# Strip trailing slashes before the SPA catch-all so Google never sees two
# 200 responses for the same page (e.g. /video/resize AND /video/resize/).
# Without this, the catch-all serves the SPA shell for the trailing-slash form
# with no canonical tag, and Google overrides the canonical we set on the real page.
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 