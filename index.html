                                Video
                            </a>
                        </li>
                        
                        <li>

                                Image
                            </a>
                        </li>
                        
                        <li>
                            <a href="/text" class="px-4 py-2 text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-gray-50 dark:hover:bg-gray-700 rounded-md transition-colors inline-flex items-center">
                                Text
                            </a>
                        </li>

                        <li>
                            <a href="/time" class="px-4 py-2 text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-gray-50 dark:hover:bg-gray-700 rounded-md transition-colors inline-flex items-center">
                                Time
                            </a>
                        </li>

                                ML

                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
